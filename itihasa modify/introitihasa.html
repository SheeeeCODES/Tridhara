<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itihasa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        #introVideo {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    .skip-button {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 10;

    padding: 10px 20px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid #d8b75a;
    color: #d8b75a;

    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;

    cursor: pointer;
}

.skip-button:hover {
    background: rgba(216, 183, 90, 0.15);
}
    </style>
</head>

<body>
    <button class="skip-button" id="skipButton">
        SKIP 
    </button>

    <video id="introVideo" autoplay muted playsinline>
        <source src="introitihasa.mp4" type="video/mp4">
    </video>
<script>
    const video = document.getElementById("introVideo");
    const skipButton = document.getElementById("skipButton");

    video.addEventListener("ended", function () {
        window.location.href = "era.html";
    });

    skipButton.addEventListener("click", function () {
        window.location.href = "era.html";
    });
</script>
</body>
</html>
