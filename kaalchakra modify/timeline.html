/* =========================================================
   WORLD
========================================================= */

.world {
    position: relative;

    height: 650px;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding-top: 30px;
}


/* =========================================================
   MAIN WHEEL
========================================================= */

.wheel {
    position: relative;

    width: 520px;
    height: 520px;

    box-sizing: border-box;

    border: 2px solid #e6c77a;

    border-radius: 50%;

    box-shadow:

        0 0 12px rgba(230, 199, 122, 0.8),

        0 0 30px rgba(230, 199, 122, 0.6),

        0 0 65px rgba(230, 199, 122, 0.35),

        0 0 110px rgba(230, 199, 122, 0.18);

    animation:
        wheelEntrance
        3.5s
        cubic-bezier(0.12, 0.75, 0.25, 1);

    transform-origin: center center;
}


/* =========================================================
   WHEEL ENTRANCE
========================================================= */

@keyframes wheelEntrance {

    0% {
        transform:
            rotate(-1440deg)
            scale(0.85);

        opacity: 0;
    }

    100% {
        transform:
            rotate(0deg)
            scale(1);

        opacity: 1;
    }
}


/* =========================================================
   SVG
========================================================= */

.wheel-svg {

    position: absolute;

    top: 35px;
    left: 35px;

    width: 450px;
    height: 450px;

    overflow: visible;

    z-index: 2;
}


/* =========================================================
   INNER CIRCUMFERENCE
========================================================= */

.inner-circle {

    fill: none;

    stroke:
        rgba(230, 199, 122, 0.85);

    stroke-width: 2.2;
}


/* =========================================================
   SECTORS
========================================================= */

.sector {

    fill:
        rgba(255, 255, 255, 0.008);

    stroke: none;

    transition:
        fill 0.3s ease,
        filter 0.3s ease;
}


/* =========================================================
   UNLOCKED SECTOR
========================================================= */

.harappan-sector {

    fill:
        rgba(230, 199, 122, 0.18);

    cursor: pointer;

    filter:
        drop-shadow(
            0 0 7px
            rgba(230, 199, 122, 0.45)
        );

    animation:
        harappaGlow 2.2s ease-in-out infinite;
}


@keyframes harappaGlow {

    0% {
        fill:
            rgba(230, 199, 122, 0.15);

        filter:
            drop-shadow(
                0 0 6px
                rgba(230, 199, 122, 0.40)
            );
    }

    50% {
        fill:
            rgba(230, 199, 122, 0.28);

        filter:
            drop-shadow(
                0 0 18px
                rgba(230, 199, 122, 0.85)
            );
    }

    100% {
        fill:
            rgba(230, 199, 122, 0.15);

        filter:
            drop-shadow(
                0 0 6px
                rgba(230, 199, 122, 0.40)
            );
    }
}


.harappan-sector:hover {

    fill:
        rgba(230, 199, 122, 0.30);

    filter:
        drop-shadow(
            0 0 18px
            rgba(230, 199, 122, 0.85)
        );
}


/* =========================================================
   SELECTED
========================================================= */

.selected-sector {

    fill:
        rgba(230, 199, 122, 0.25);

    filter:
        drop-shadow(
            0 0 18px
            rgba(230, 199, 122, 0.85)
        );
}


/* =========================================================
   LOCKED
========================================================= */

.locked {

    fill:
        rgba(255, 255, 255, 0.006);

    cursor: default;
}


/* =========================================================
   DIVIDERS
========================================================= */

.dividers line {

    stroke:
        rgba(230, 199, 122, 0.55);

    stroke-width: 1.5;

    stroke-linecap: butt;
}


/* =========================================================
   LEVEL NUMBERS
========================================================= */

.level-number {

    fill:
        rgba(230, 199, 122, 0.82);

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 3px;

    text-anchor: middle;

    dominant-baseline: middle;
}


.harappan-number {

    fill: #f1d98a;

    font-size: 17px;

    filter:
        drop-shadow(
            0 0 5px
            rgba(230, 199, 122, 0.7)
        );
}


/* =========================================================
   SYMBOLS
========================================================= */

.symbol {

    fill: none;

    stroke:
        rgba(230, 199, 122, 0.48);

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.harappan-symbol {

    stroke: #f1d98a;

    stroke-width: 2.8;

    filter:
        drop-shadow(
            0 0 7px
            rgba(230, 199, 122, 0.8)
        );
}


/* =========================================================
   COMPASS
========================================================= */

.compass {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 170px;
    height: 170px;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    pointer-events: none;
}


.compass-ring {

    fill:
        rgba(3, 11, 24, 0.78);

    stroke:
        #e6c77a;

    stroke-width: 2.5;

    filter:
        drop-shadow(
            0 0 8px
            rgba(230, 199, 122, 0.7)
        );
}


.compass-inner-ring {

    fill: none;

    stroke:
        rgba(230, 199, 122, 0.35);

    stroke-width: 1.5;
}


.compass-mark {

    stroke:
        rgba(230, 199, 122, 0.65);

    stroke-width: 2;

    stroke-linecap: round;
}


.compass-cardinal {

    fill:
        #e6c77a;

    font-family:
        Georgia,
        serif;

    font-size: 13px;

    font-weight: bold;

    text-anchor: middle;
}


.compass-needle {

    transform-origin:
        85px 85px;

    transition:
        transform 1s
        cubic-bezier(0.22, 1, 0.36, 1);
}


.needle-north {

    fill: #e6c77a;

    stroke: #f5dc94;

    stroke-width: 1;
}


.needle-south {

    fill:
        rgba(230, 199, 122, 0.18);

    stroke:
        rgba(230, 199, 122, 0.75);

    stroke-width: 1;
}


.compass-center {

    fill: #e6c77a;

    filter:

            0 0 7px
            rgba(230, 199, 122, 0.9)

}

<script>

/*
=============================================================
LEVEL DATA
=============================================================
*/
function changeLanguage(language) {

    const select =
        document.querySelector(".goog-te-combo");

    if (!select) {

        setTimeout(function() {
            changeLanguage(language);
        }, 500);

        return;
    }

    select.value = language;

    select.dispatchEvent(
        new Event("change", {
            bubbles: true
        })
    );
}


const languageButton =
    document.getElementById("languageButton");

const languageMenu =
    document.getElementById("languageMenu");


languageButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        languageMenu.classList.toggle("open");

    }
);


document.addEventListener(
    "click",
    function() {

        languageMenu.classList.remove("open");

    }
);


function googleTranslateElementInit() {

    new google.translate.TranslateElement(
        {
            pageLanguage: "en",

            includedLanguages:
                "en,hi,bn,or,ta,te,ml,mr,gu,pa",

            autoDisplay: false
        },

        "google_translate_element"
    );
}
const levels = {

    harappan: {

        title: "01 — HARAPPAN CIVILIZATION",

        angle: 30,

        page: "harappa.html",

        completionKey: "harappaCompleted"

    },

    vedic: {

        title: "02 — VEDIC PERIOD",

        angle: 82,

        page: "vedic.html",

        completionKey: "vedicCompleted"

    },

    mauryan: {

        title: "03 — MAURYAN EMPIRE",

        angle: 133,

        page: "mauryan.html",

        completionKey: "mauryanCompleted"

    },

    gupta: {

        title: "04 — GUPTA EMPIRE",

        angle: 180,

        page: "gupta.html",

        completionKey: "guptaCompleted"

    },

    chola: {

        title: "05 — CHOLA DYNASTY",

        angle: 231,

        page: "chola.html",

        completionKey: "cholaCompleted"

    },

    sultanates: {

        title: "06 — DELHI SULTANATES",

        angle: 283,

        page: "sultanates.html",

        completionKey: "sultanatesCompleted"

    },

    mughal: {

        title: "07 — MUGHAL EMPIRE",

        angle: 334,

        page: "mughal.html",

        completionKey: "mughalCompleted"

    }

};


/*
=============================================================
UNLOCK SYSTEM
=============================================================
*/

function updateUnlockedLevels() {

    const levelNames =
        Object.keys(levels);


    /*
       First level is always unlocked.
    */

    levels.harappan.unlocked =
        true;


    /*
       Read shared game storage.
    */

    const storageKey =
        "bharatTimeMachine";


    const gameState =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || {};


    /*
       Every unlocked level
       controls the next sector.
    */

    for (
        let i = 0;
        i < levelNames.length - 1;
        i++
    ) {

        const current =
            levels[levelNames[i]];

        const next =
            levels[levelNames[i + 1]];


        const completed =
            gameState.levels &&
            gameState.levels[levelNames[i]] &&
            gameState.levels[levelNames[i]].completed === true;


        /*
           Change the visual appearance
           of the next sector.
        */

        const nextSector =
            document.getElementById(
                levelNames[i + 1] + "Sector"
            );


        if (nextSector) {

            if (completed) {

                next.unlocked =
                    true;


                nextSector.classList.remove(
                    "locked"
                );

                nextSector.classList.add(
                    "harappan-sector"
                );

            } else {

                next.unlocked =
                    false;


                nextSector.classList.remove(
                    "harappan-sector"
                );

                nextSector.classList.add(
                    "locked"
                );

            }

        }

    }

}


/*
=============================================================
SELECT LEVEL
=============================================================
*/

let currentLevel =
    "harappan";

let levelSelected =
    false;


function selectLevel(level) {

    const data =
        levels[level];


    /*
       If locked, do nothing.
    */

    if (!data || !data.unlocked) {

        return;

    }


    /*
       If clicked twice,
       enter the level.
    */

    if (
        currentLevel === level &&
        levelSelected
    ) {

        if (data.page) {

            window.location.href =
                data.page;

        }

        return;

    }


    /*
       Select this level.
    */

    currentLevel =
        level;

    levelSelected =
        true;


    /*
       Remove old selection.
    */

    document
        .querySelectorAll(".sector")
        .forEach(
            sector => {

                sector.classList.remove(
                    "selected-sector"
                );

            }
        );


    /*
       Highlight selected sector.
    */

    const selected =
        document.getElementById(
            level + "Sector"
        );


    if (selected) {

        selected.classList.add(
            "selected-sector"
        );

    }


    /*
       Update text.
    */

    document
        .getElementById(
            "selectedTitle"
        )
        .textContent =
        data.title;


    document
        .getElementById(
            "selectedSubtitle"
        )
        .textContent =
        "UNLOCKED LEVEL";


    /*
       Rotate compass.
    */

    rotateCompass(
        data.angle
    );

}


/*
=============================================================
COMPASS
=============================================================
*/

function rotateCompass(angle) {

    const needle =
        document.getElementById(
            "compassNeedle"
        );


    if (needle) {

        needle.style.transform =
            `rotate(${angle}deg)`;

    }

}


/*
=============================================================
PAGE LOAD
=============================================================
*/

window.addEventListener(
    "load",
    () => {

        /*
           Read completion data
           BEFORE displaying timeline.
        */

        updateUnlockedLevels();


        /*
           Default selection.
        */

        currentLevel =
            "harappan";

        levelSelected =
            false;


        /*
           Read Harappa completion
           from shared storage.
        */

        const storageKey =
            "bharatTimeMachine";


        const gameState =
            JSON.parse(
                localStorage.getItem(storageKey)
            ) || {};


        const harappanCompleted =
            gameState.levels &&
            gameState.levels.harappan &&
            gameState.levels.harappan.completed === true;


        document
            .getElementById(
                "selectedTitle"
            )
            .textContent =
            levels.harappan.title;


        document
            .getElementById(
                "selectedSubtitle"
            )
            .textContent =
            harappanCompleted
            ? "COMPLETED — NEXT LEVEL UNLOCKED"
            : "CURRENT LEVEL";


        /*
           Point compass to Harappa.
        */

        rotateCompass(
            levels.harappan.angle
        );

    }
);
window.addEventListener(
    "load",
    () => {

        // ... your existing code ...

        rotateCompass(
            levels.harappan.angle
        );

    }
);
/* =========================================================
   DEMO RESET — CLEAR GAME PROGRESS
========================================================= */

function resetGameProgress() {

    localStorage.removeItem("bharatTimeMachine");
    sessionStorage.clear();

    location.reload();
}


document.addEventListener("keydown", function(event) {

    if (
        event.ctrlKey &&
        event.shiftKey &&
        event.key.toLowerCase() === "r"
    ) {

        event.preventDefault();

        resetGameProgress();

    }

});
