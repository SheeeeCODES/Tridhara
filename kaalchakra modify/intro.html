    <script>

        const video = document.getElementById("introVideo");
        const skipButton = document.getElementById("skipButton");
        function changeLanguage(language) {

    const select = document.querySelector(".goog-te-combo");

    if (!select) {

        setTimeout(function () {
            changeLanguage(language);
        }, 500);

        return;
    }

    select.value = language;

    select.dispatchEvent(
        new Event("change", { bubbles: true })
    );
}


const languageButton =
    document.getElementById("languageButton");

const languageMenu =
    document.getElementById("languageMenu");


languageButton.addEventListener("click", function (event) {

    event.stopPropagation();

    languageMenu.classList.toggle("open");

});


document.addEventListener("click", function () {

    languageMenu.classList.remove("open");

});


function googleTranslateElementInit() {

    new google.translate.TranslateElement(
        {
            pageLanguage: "en",
            includedLanguages:
                "en,hi,bn,or,ta,te,ml,mr,gu,pa"
        },
        "google_translate_element"
    );

}


setInterval(function () {

    const bar =
        document.querySelector("body > .skiptranslate");

    if (bar) {
        bar.style.display = "none";
    }

    document.body.style.top = "0px";

}, 100);

        /*
        =====================================================
        GO TO KAALCHAKRA INDEX PAGE
        =====================================================
        */

        function goToKaalchakra() {

            window.location.href = "./index.html";

        }


        /*
        =====================================================
        WHEN VIDEO FINISHES
        =====================================================
        */

        video.addEventListener("ended", function () {

            goToKaalchakra();

        });


        /*
        =====================================================
        SKIP BUTTON
        =====================================================
        */

        skipButton.addEventListener("click", function () {

            goToKaalchakra();

        });


        /*
        =====================================================
        IF VIDEO CANNOT LOAD
        =====================================================
        */

        video.addEventListener("error", function () {

            console.log("Video could not be loaded.");

            goToKaalchakra();

        });

    </script>

<div id="google_translate_element" translate="no"></div>
