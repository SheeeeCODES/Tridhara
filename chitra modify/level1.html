<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nrityam — Level 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Georgia,serif;
}

body{
    background-image:url("bg.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:#f5d98b;

    /* VERY IMPORTANT:
       Google Translate must never push the page down */
    top:0 !important;
    position:relative !important;
}

/* =========================================================
   GOOGLE TRANSLATE — HIDE THE ENTIRE GOOGLE UI
   ========================================================= */

/* Hide Google top translation banner */
.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate,
iframe.goog-te-banner-frame,
iframe.goog-te-banner-frame.skiptranslate{
    display:none !important;
    visibility:hidden !important;
    height:0 !important;
    width:0 !important;
    position:absolute !important;
    top:-9999px !important;
    left:-9999px !important;
}

/* Hide Google popup/menu/balloon */
.goog-te-menu-frame,
.goog-te-balloon-frame,
iframe.goog-te-menu-frame,
iframe.goog-te-balloon-frame{
    display:none !important;
    visibility:hidden !important;
}

/* Hide the Google widget itself */
#google_translate_element{
    position:absolute !important;
    width:1px !important;
    height:1px !important;
    overflow:hidden !important;
    opacity:0 !important;
    pointer-events:none !important;
}

/* Google sometimes adds this */
.goog-te-gadget{
    font-size:0 !important;
}

/* Prevent Google's injected spacing */
.goog-te-gadget > span{
    display:none !important;
}

body > .skiptranslate{
    display:none !important;
    visibility:hidden !important;
}

/* =========================================================
   NAVIGATION BAR
   ========================================================= */

.nav-shell{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:88px;
    z-index:9000;
    pointer-events:none;
}

.nav-group{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:88px;

    transition:
        transform .55s cubic-bezier(.22,.61,.36,1);

    pointer-events:none;
}

/* NAV BAR */

.top-nav{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:62px;

    padding:0 22px 0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            180deg,
            rgba(48,28,17,.98) 0%,
            rgba(35,20,12,.98) 55%,
            rgba(20,12,7,.99) 100%
        );

    border-bottom:
        1px solid rgba(216,168,62,.82);

    box-shadow:
        0 3px 15px rgba(0,0,0,.7),
        0 1px 0 rgba(255,210,100,.16);

    pointer-events:auto;
}

/* LEFT SIDE */

.nav-left{
    display:flex;
    align-items:center;
    gap:10px;
}

/* RIGHT SIDE */

.nav-right{
    display:flex;
    align-items:center;
}

/* COMMON NAV BUTTON */

.nav-button{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-width:112px;
    height:37px;

    padding:0 18px;

    text-decoration:none;

    background:
        linear-gradient(
            180deg,
            rgba(18,13,9,.98),
            rgba(4,4,3,.98)
        );

    border:1px solid rgba(205,160,64,.62);
    border-radius:3px;

    color:#f5d98b;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:.73rem;
    font-weight:bold;
    letter-spacing:.18em;

    text-shadow:
        0 0 7px rgba(245,217,139,.18);

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.7),
        0 2px 7px rgba(0,0,0,.45);

    transition:
        transform .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.nav-button::before{
    content:"";
    position:absolute;
    left:9px;
    right:9px;
    bottom:4px;
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(216,168,62,.6),
            transparent
        );

    opacity:.65;
}

.nav-button:hover{
    transform:translateY(-2px);

    background:
        linear-gradient(
            180deg,
            rgba(43,27,15,.98),
            rgba(10,7,4,.99)
        );

    border-color:#e2b95d;

    box-shadow:
        0 0 10px rgba(216,168,62,.22),
        inset 0 0 12px rgba(184,130,35,.12);
}

/* LANGUAGE AREA */

.language-area{
    position:relative;
}

/* LANGUAGE BUTTON */

.language-button{
    min-width:142px;
    height:37px;

    padding:0 13px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    cursor:pointer;

    background:
        linear-gradient(
            180deg,
            rgba(18,13,9,.98),
            rgba(4,4,3,.98)
        );

    border:1px solid rgba(205,160,64,.62);
    border-radius:3px;

    color:#f5d98b;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:.72rem;
    font-weight:bold;
    letter-spacing:.15em;

    text-shadow:
        0 0 7px rgba(245,217,139,.18);

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.7),
        0 2px 7px rgba(0,0,0,.45);

    transition:
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.language-button:hover,
.language-area.open .language-button{
    background:
        linear-gradient(
            180deg,
            rgba(43,27,15,.98),
            rgba(10,7,4,.99)
        );

    border-color:#e2b95d;

    box-shadow:
        0 0 12px rgba(216,168,62,.25),
        inset 0 0 12px rgba(184,130,35,.12);
}

.language-icon{
    font-size:.75rem;
    color:#d8a83e;
}

.language-arrow{
    font-size:.58rem;

    transition:
        transform .25s ease;
}

.language-area.open .language-arrow{
    transform:rotate(180deg);
}

/* LANGUAGE DROPDOWN */

.language-menu{
    position:absolute;

    top:45px;
    right:0;

    width:168px;

    padding:7px;

    display:none;
    flex-direction:column;
    gap:4px;

    background:
        linear-gradient(
            180deg,
            rgba(47,28,16,.99),
            rgba(18,11,7,.99)
        );

    border:1px solid rgba(216,168,62,.72);
    border-radius:3px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.8),
        0 0 15px rgba(216,168,62,.16);
}

.language-area.open .language-menu{
    display:flex;

    animation:
        languageDrop .22s ease-out;
}

@keyframes languageDrop{
    from{
        opacity:0;
        transform:translateY(-7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.language-option{
    width:100%;
    min-height:31px;

    padding:5px 8px;

    border:1px solid transparent;
    border-radius:2px;

    background:
        rgba(7,5,3,.9);

    color:#f1d48a;

    font-family:
        Georgia,
        "Noto Sans",
        "Noto Sans Devanagari",
        serif;

    font-size:.72rem;

    cursor:pointer;

    transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease;
}

.language-option:hover{
    background:
        rgba(121,78,27,.35);

    border-color:
        rgba(216,168,62,.55);

    color:#ffe9a5;
}

/* NAV TOGGLE */

.nav-toggle{
    position:absolute;

    top:62px;
    right:7px;

    width:31px;
    height:23px;

    border:
        1px solid rgba(216,168,62,.72);

    border-top:none;

    border-radius:
        0 0 4px 4px;

    background:
        linear-gradient(
            180deg,
            rgba(40,23,13,.98),
            rgba(13,8,5,.99)
        );

    color:#f5d98b;

    font-family:Georgia,serif;
    font-size:.72rem;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 10px rgba(0,0,0,.65);

    pointer-events:auto;

    z-index:10001;

    transition:
        background .2s ease,
        color .2s ease;
}

.nav-toggle:hover{
    background:
        rgba(93,57,22,.98);

    color:#ffe8a3;
}

/* BOTH NAV + ARROW MOVE TOGETHER */

.nav-group.collapsed{
    transform:translateY(-62px);
}

/* =========================================================
   OPENING REVEAL
   ========================================================= */

.opening-reveal{
    position:fixed;
    inset:0;
    z-index:99999;
    pointer-events:none;
    overflow:hidden;
    display:flex;
}

.opening-reveal img{
    position:absolute;
    top:0;
    width:50vw;
    height:100vh;
    object-fit:fill;
    opacity:1;
    will-change:transform;
}

.opening-left{
    left:0;
    transform:translateX(0);
    animation:
        openingLeft 4s cubic-bezier(.22,.61,.36,1) forwards;
}

.opening-right{
    right:0;
    transform:translateX(0);
    animation:
        openingRight 4s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes openingLeft{
    0%,25%{
        transform:translateX(0);
        opacity:1;
    }

    100%{
        transform:translateX(-100%);
        opacity:1;
    }
}

@keyframes openingRight{
    0%,25%{
        transform:translateX(0);
        opacity:1;
    }

    100%{
        transform:translateX(100%);
        opacity:1;
    }
}

/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.layout{
    display:flex;
    min-height:100vh;

    padding:
        28px
        180px
        28px
        12px;

    align-items:flex-start;
}

/* =========================================================
   LEFT PANEL
   ========================================================= */

.left-pane{
    flex:0 0 310px;

    position:sticky;
    top:28px;

    min-height:600px;

    border:1px solid #b8972a;
    border-radius:4px;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(0,0,0,.78)
        ),
        url("cbg.avif");

    background-size:cover;
    background-position:center;

    box-shadow:
        0 0 25px rgba(0,0,0,.45),
        inset 0 0 35px rgba(0,0,0,.4);
}

.pane-title-wrap{
    width:100%;
    overflow:hidden;

    border-radius:4px 4px 0 0;

    line-height:0;
}

.pane-title-img{
    width:184%;

    margin-left:-42%;

    display:block;

    mix-blend-mode:screen;

    margin-top:-8px;
    margin-bottom:-20px;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 22%,
            black 78%,
            transparent 100%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 22%,
            black 78%,
            transparent 100%
        );
}

.pane-body{
    padding:0 18px 18px;

    display:flex;
    flex-direction:column;

    flex:1;
}

.pane-divider{
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            #b8972a,
            transparent
        );

    margin-bottom:16px;
}

/* =========================================================
   IDLE TEXT
   ========================================================= */

.pane-idle{
    text-align:center;

    color:#c9a84c;

    font-size:.76rem;

    letter-spacing:.1em;

    line-height:2;

    text-transform:uppercase;
}

.pane-idle .flow-line{
    display:block;

    opacity:0;

    transform:translateY(8px);

    animation:
        paneFlow .8s ease-out forwards;
}

.pane-idle .flow-line:nth-child(1){
    animation-delay:.15s;
}

.pane-idle .flow-line:nth-child(2){
    animation-delay:.38s;
}

.pane-idle .flow-line:nth-child(3){
    animation-delay:.61s;
}

.pane-idle .flow-line:nth-child(4){
    animation-delay:.84s;
}

.pane-idle .flow-line:nth-child(5){
    animation-delay:1.07s;
}

.pane-idle .flow-line:nth-child(6){
    animation-delay:1.30s;
}

.pane-idle .hint{
    margin-top:12px;

    font-size:.63rem;

    opacity:.5;
}

/* =========================================================
   INFORMATION
   ========================================================= */

.pane-info{
    display:none;

    flex-direction:column;

    gap:10px;
}

.pane-info.visible{
    display:flex;
}

.pane-info .flow-item{
    opacity:0;

    transform:translateY(8px);

    animation:
        paneFlow .75s ease-out forwards;
}

.pane-info .info-state{
    animation-delay:.05s;
}

.pane-info .info-dance{
    animation-delay:.25s;
}

.pane-info .info-divider{
    animation-delay:.45s;
}

.pane-info .info-desc{
    animation-delay:.65s;
}

.pane-info .info-tag{
    animation-delay:.90s;
}

@keyframes paneFlow{
    from{
        opacity:0;
        transform:translateY(9px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.info-state{
    font-size:1.15rem;

    font-weight:800;

    letter-spacing:.14em;

    text-transform:uppercase;

    color:#f5d98b;

    text-align:center;
}

.info-dance{
    font-size:.95rem;

    font-weight:700;

    letter-spacing:.1em;

    text-transform:uppercase;

    color:#c9a84c;

    text-align:center;
}

.info-divider{
    height:1px;

    background:
        linear-gradient(
            to right,
            transparent,
            #b8972a,
            transparent
        );
}

.info-desc{
    font-size:.78rem;

    color:#d4b96a;

    line-height:1.85;

    text-align:center;
}

.info-tag{
    font-size:.68rem;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:#7a5c10;

    text-align:center;
}

/* =========================================================
   SCORE
   ========================================================= */

.score-bar{
    margin-top:auto;

    padding-top:14px;

    border-top:
        1px solid rgba(184,151,42,.3);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.score-label{
    font-size:.6rem;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:#7a5c10;
}

.score-val{
    font-size:1rem;

    font-weight:900;

    color:#f5d98b;
}

/* =========================================================
   TIMER
   ========================================================= */

.timer-box{
    margin-top:10px;

    padding:7px 10px;

    border:
        1px solid rgba(184,151,42,.55);

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:rgba(0,0,0,.28);
}

.timer-label{
    font-size:.6rem;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:#7a5c10;
}

.timer{
    font-size:1rem;

    font-weight:900;

    letter-spacing:.08em;

    color:#f5d98b;

    min-width:42px;

    text-align:right;
}

.timer.warning{
    color:#e8a84c;
}

.timer.danger{
    color:#e05a47;
}

/* =========================================================
   WIN BANNER
   ========================================================= */

.win-banner{
    display:none;

    text-align:center;

    padding:9px;

    background:rgba(139,0,0,.5);

    border:1px solid #b8972a;

    border-radius:3px;

    font-size:.68rem;

    letter-spacing:.12em;

    text-transform:uppercase;

    color:#f5d98b;

    margin-top:10px;

    line-height:1.7;
}

.win-banner.visible{
    display:block;
}

/* =========================================================
   RESET
   ========================================================= */

.reset-btn{
    margin-top:10px;

    width:100%;

    padding:8px;

    background:transparent;

    border:1px solid #b8972a;

    color:#f5d98b;

    font-family:Georgia,serif;

    font-size:.63rem;

    letter-spacing:.18em;

    text-transform:uppercase;

    cursor:pointer;

    transition:background .2s;
}

.reset-btn:hover{
    background:rgba(184,151,42,.15);
}

/* =========================================================
   CARDS
   ========================================================= */

.cards-area{
    flex:1;

    display:flex;

    flex-direction:column;

    gap:22px;

    justify-content:center;

    padding:6px 0 0;

    margin-left:-56px;
}

.card-row{
    display:flex;

    gap:22px;

    justify-content:center;
}

.flip-card{
    width:220px;
    height:270px;

    perspective:1000px;

    cursor:pointer;

    transition:
        transform .25s ease,
        filter .25s ease;
}

.flip-card:hover{
    transform:
        translateY(-8px)
        scale(1.035);

    filter:
        drop-shadow(
            0 0 12px
            rgba(245,217,139,.65)
        )
        drop-shadow(
            0 0 25px
            rgba(212,168,71,.35)
        );
}

.flip-card-inner{
    position:relative;

    width:100%;
    height:100%;

    transition:
        transform .65s
        cubic-bezier(.4,.2,.2,1);

    transform-style:preserve-3d;
}

.flip-card.revealed .flip-card-inner{
    transform:rotateY(180deg);
}

.flip-card-front,
.flip-card-back{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border-radius:6px;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    overflow:hidden;
}

.flip-card-front{
    border:2px solid #c9a840;

    background-image:url("cbg.avif");

    background-size:cover;

    background-position:center;
}

.flip-card-front::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.05) 0%,
            rgba(0,0,0,.42) 100%
        );

    border-radius:4px;
}

.flip-card-back{
    transform:rotateY(180deg);

    border:2px solid #b8972a;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:14px 10px;

    text-align:center;
}

.flip-card-back.type-state,
.flip-card-back.type-dance{
    position:relative;

    display:block;

    padding:0;

    border-color:#d4a847;

    background:#000;
}

.state-image,
.dance-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;
}

.state-image img,
.dance-image img{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    margin:0;
    padding:0;
}

.dance-image img.ghoomar-image{
    object-position:center 35%;
}

.flip-card.matched .flip-card-back{
    box-shadow:
        0 0 20px
        rgba(212,168,71,.6);
}

.flip-card.locked{
    pointer-events:none;
}

.flip-card.game-finished{
    pointer-events:auto;

    cursor:pointer;
}

.flip-card.game-finished:hover{
    transform:
        translateY(-8px)
        scale(1.035);

    filter:
        drop-shadow(
            0 0 12px
            rgba(245,217,139,.65)
        )
        drop-shadow(
            0 0 25px
            rgba(212,168,71,.35)
        );
}

.flip-card.selected-card{
    position:relative;

    z-index:20;

    transform:translateY(-5px);
}

.flip-card.selected-card .flip-card-back{
    border-color:#f5d98b;

    box-shadow:
        0 0 18px rgba(245,217,139,.8),
        0 0 35px rgba(212,168,71,.5);
}

/* =========================================================
   NATARAJA
   ========================================================= */

.nataraja{
    position:fixed;

    bottom:8px;
    right:20px;

    width:260px;

    pointer-events:none;

    z-index:9;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,190,60,.3)
        )
        drop-shadow(
            0 0 22px
            rgba(212,140,20,.2)
        );

    animation:
        natGlow 3.5s ease-in-out infinite;

    transform-origin:bottom center;
}

@keyframes natGlow{
    0%,100%{
        filter:
            drop-shadow(
                0 0 8px
                rgba(255,190,60,.3)
            )
            drop-shadow(
                0 0 22px
                rgba(212,140,20,.2)
            );
    }

    50%{
        filter:
            drop-shadow(
                0 0 14px
                rgba(255,210,80,.45)
            )
            drop-shadow(
                0 0 36px
                rgba(200,140,20,.3)
            );
    }
}

/* =========================================================
   LAMPS
   ========================================================= */

.lamp-wrap{
    position:fixed;

    z-index:8;

    pointer-events:none;

    transform-origin:top center;

    will-change:transform;
}

.lamp-left{
    right:calc(260px - 4cm);

    top:5px;

    animation:
        lampSwayLeft 5.8s
        ease-in-out infinite;

    animation-delay:-1.4s;
}

.lamp-right{
    right:calc(30px - 2cm);

    top:105px;

    animation:
        lampSwayRight 4.25s
        ease-in-out infinite;

    animation-delay:-3.1s;
}

.lamp-wrap img{
    width:calc(200px + 3cm);

    height:auto;

    display:block;

    animation:
        lampGlow 3.2s
        ease-in-out infinite;
}

@keyframes lampGlow{
    0%,100%{
        filter:
            drop-shadow(
                0 0 10px
                rgba(255,190,60,.50)
            )
            drop-shadow(
                0 0 22px
                rgba(255,160,20,.30)
            )
            drop-shadow(
                0 0 38px
                rgba(255,210,90,.12)
            );
    }

    50%{
        filter:
            drop-shadow(
                0 0 18px
                rgba(255,210,80,.85)

<!-- =========================================================

     ========================================================= -->

<script>

/* =========================================================
   NAV OPEN / CLOSE
   ========================================================= */

const navGroup =
    document.getElementById("navGroup");

const navToggle =
    document.getElementById("navToggle");

let navCollapsed = false;

navToggle.addEventListener(
    "click",
    function(){

        navCollapsed =
            !navCollapsed;

        navGroup.classList.toggle(
            "collapsed",
            navCollapsed
        );

        navToggle.textContent =
            navCollapsed
                ? "▼"
                : "▲";

        navToggle.setAttribute(
            "aria-label",
            navCollapsed
                ? "Expand navigation"
                : "Collapse navigation"
        );

    }
);


/* =========================================================
   LANGUAGE DROPDOWN
   ========================================================= */

const languageArea =
    document.getElementById(
        "languageArea"
    );

const languageButton =
    document.getElementById(
        "languageButton"
    );

languageButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        languageArea.classList.toggle(
            "open"
        );

    }
);


/* CLOSE DROPDOWN WHEN CLICKING OUTSIDE */

document.addEventListener(
    "click",
    function(event){

        if(
            !languageArea.contains(
                event.target
            )
        ){

            languageArea.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   GOOGLE TRANSLATE COMBO FINDER
   ========================================================= */

function getGoogleTranslateCombo(
    callback
){

    const combo =
        document.querySelector(
            ".goog-te-combo"
        );

    if(combo){

        callback(combo);

        return;
    }

    setTimeout(
        function(){

            getGoogleTranslateCombo(
                callback
            );

        },
        300
    );

}


/* =========================================================
   TRANSLATE PAGE
   ========================================================= */

function translatePage(language){

    getGoogleTranslateCombo(
        function(combo){

            combo.value =
                language;

            combo.dispatchEvent(
                new Event(
                    "change",
                    {
                        bubbles:true
                    }
                )
            );

        }
    );

}


/* =========================================================
   LANGUAGE OPTIONS
   ========================================================= */

document
    .querySelectorAll(
        ".language-option"
    )
    .forEach(
        function(option){

            option.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    const language =
                        option.dataset.lang;

                    translatePage(
                        language
                    );

                    languageArea.classList.remove(
                        "open"
                    );

                }
            );

        }
    );


/* =========================================================
   GOOGLE BANNER KILLER
   RUNS REPEATEDLY BECAUSE GOOGLE CAN
   RECREATE ITS IFRAME AFTER TRANSLATION
   ========================================================= */

function completelyHideGoogleUI(){

    /* Banner */

    document
        .querySelectorAll(
            ".goog-te-banner-frame, " +
            ".goog-te-banner-frame.skiptranslate, " +
            "iframe.goog-te-banner-frame, " +
            "iframe.goog-te-banner-frame.skiptranslate"
        )
        .forEach(
            function(element){

                element.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

                element.style.setProperty(
                    "visibility",
                    "hidden",
                    "important"
                );

                element.style.setProperty(
                    "height",
                    "0px",
                    "important"
                );

                element.style.setProperty(
                    "width",
                    "0px",
                    "important"
                );

                element.style.setProperty(
                    "top",
                    "-9999px",
                    "important"
                );

            }
        );


    /* Menu / popup */

    document
        .querySelectorAll(
            ".goog-te-menu-frame, " +
            ".goog-te-balloon-frame, " +
            "iframe.goog-te-menu-frame, " +
            "iframe.goog-te-balloon-frame"
        )
        .forEach(
            function(element){

                element.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

                element.style.setProperty(
                    "visibility",
                    "hidden",
                    "important"
                );

            }
        );


    /* Google-added body positioning */

    document.body.style.setProperty(
        "top",
        "0px",
        "important"
    );

}


/* Immediately */

completelyHideGoogleUI();


/* Repeated protection */

setInterval(
    completelyHideGoogleUI,
    100
);


/* Watch Google's injected elements */

const googleObserver =
    new MutationObserver(
        function(){

            completelyHideGoogleUI();

        }
    );

googleObserver.observe(
    document.documentElement,
    {
        childList:true,
        subtree:true,
        attributes:true
    }
);

</script>

            "A high-energy Punjabi folk dance traditionally associated with harvest celebrations, driven by powerful movements and dhol rhythms. Dancers use energetic jumps, shoulder movements and expressive gestures to create its distinctive celebratory style. Bhangra has also become a widely recognised symbol of Punjabi culture across India and around the world.",

        tag:
            "Punjab • Folk Dance"
    },

    {
        id:"ker",

        state:"Kerala",

        dance:"Kathakali",

        stateImg:"kl",

        desc:
            "Kerala's dramatic classical dance-theatre tradition, known for elaborate makeup, costumes, expressive gestures and storytelling.",

        tag:
            "Kerala • Classical Dance"
    },

    {
        id:"tn",

        state:"Tamil Nadu",

        dance:"Bharatanatyam",

        stateImg:"tn",

        desc:
            "One of India's major classical dance traditions, celebrated for precise footwork, expressive gestures and sculptural poses.",

        tag:
            "Tamil Nadu • Classical Dance"
    },

    {
        id:"odi",

        state:"Odisha",

        dance:"Odissi",

        stateImg:"odd",

        desc:
            "An ancient classical dance tradition from Odisha, recognised for its tribhangi posture, graceful movements and expressive storytelling.",

        tag:
            "Odisha • Classical Dance"
    },

    {
        id:"man",

        state:"Manipur",

        dance:"Manipuri",

        stateImg:"mn",

        desc:
            "A graceful classical tradition from Manipur, famous for its gentle movements, rounded forms and devotional themes.",

        tag:
            "Manipur • Classical Dance"
    }

];


/* GAME STATE */

let flipped = [];

let matched = new Set();

let locked = false;

let score = 0;

let timeLeft = 15;

let timerInterval = null;

let timeIsUp = false;


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );

    timerInterval =
        setInterval(
            function(){

                timeLeft--;

                const timer =
                    document.getElementById(
                        "timer"
                    );

                timer.textContent =
                    timeLeft;

                if(timeLeft <= 10){

                    timer.classList.remove(
                        "warning"
                    );

                    timer.classList.add(
                        "danger"
                    );

                }
                else if(timeLeft <= 15){

                    timer.classList.add(
                        "warning"
                    );

                }

                if(timeLeft <= 0){

                    clearInterval(
                        timerInterval
                    );

                    timeUp();

                }

            },
            1000
        );

}


/* =========================================================
   TIME UP
   ========================================================= */

function timeUp(){

    timeIsUp = true;

    locked = false;

    document
        .querySelectorAll(
            ".flip-card"
        )
        .forEach(
            function(card){

                card.classList.remove(
                    "locked"
                );

                card.classList.add(
                    "revealed",
                    "game-finished"
                );

            }
        );

    const winBanner =
        document.getElementById(
            "winBanner"
        );

    winBanner.innerHTML = `
        ✦ Time's Up! ✦<br>
        You found ${score} / 2 pairs.
    `;

    winBanner.classList.add(
        "visible"
    );

    setTimeout(
        function(){

            showLosePopup();

        },
        700
    );

}


/* =========================================================
   WIN POPUP
   ========================================================= */

function showWinPopup(){

    const overlay =
        document.getElementById(
            "resultOverlay"
        );

    const title =
        document.getElementById(
            "resultTitle"
        );

    const message =
        document.getElementById(
            "resultMessage"
        );

    overlay.classList.remove(
        "loss"
    );

    overlay.classList.add(
        "win"
    );

    title.textContent =
        "✦ LEVEL 1 COMPLETE ✦";

    message.innerHTML =
        "Beautifully done.<br>" +
        "You matched every state with its dance tradition.";

    overlay.classList.add(
        "visible"
    );

    /* Only remember this unlock for a signed-in player.
       Guests never persist progress (see progress-guard.js). */

    if (
        window.TridharaProgress &&
        window.TridharaProgress.canSave()
    ) {

        localStorage.setItem(
            "chitraLevel2Unlocked",
            "true"
        );

    }

}


/* =========================================================
   LOSE POPUP
   ========================================================= */

function showLosePopup(){

    const overlay =
        document.getElementById(
            "resultOverlay"
        );

    const title =
        document.getElementById(
            "resultTitle"
        );

    const message =
        document.getElementById(
            "resultMessage"
        );

    overlay.classList.remove(
        "win"
    );

    overlay.classList.add(
        "loss"
    );

    title.textContent =
        "✦ TIME'S UP ✦";

    message.innerHTML =
        "The dance awaits another attempt.<br><br>" +
        "Would you like to try again?";

    overlay.classList.add(
        "visible"
    );

}


/* =========================================================
   LATER
   ========================================================= */

function enterTheoryMode(){

    const overlay =
        document.getElementById(
            "resultOverlay"
        );

    overlay.classList.remove(
        "visible",
        "win",
        "loss"
    );

    document
        .getElementById(
            "theoryModeBar"
        )
        .classList.add(
            "visible"
        );

    document
        .getElementById(
            "completedNav"
        )
        .classList.add(
            "visible"
        );

    locked = true;

    document
        .querySelectorAll(
            ".flip-card"
        )
        .forEach(
            function(card){

                card.classList.add(
                    "game-finished"
                );

                card.classList.remove(
                    "locked"
                );

            }
        );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goToNextLevel(){

    window.location.href =
        "level2.html";

}

function goToStudio(){

    window.location.href =
        "comsp.html";

}


/* =========================================================
   REPLAY
   ========================================================= */

function replayLevel(){

    const overlay =
        document.getElementById(
            "resultOverlay"
        );

    overlay.classList.remove(
        "visible",
        "win",
        "loss"
    );

    document
        .getElementById(
            "theoryModeBar"
        )
        .classList.remove(
            "visible"
        );

    document
        .getElementById(
            "completedNav"
        )
        .classList.remove(
            "visible"
        );

    initGame();

}


/* =========================================================
   INITIALISE
   ========================================================= */

function initGame(){

    const theoryBar =
        document.getElementById(
            "theoryModeBar"
        );

    const completedNav =
        document.getElementById(
            "completedNav"
        );

    if(theoryBar){

        theoryBar.classList.remove(
            "visible"
        );

    }

    if(completedNav){

        completedNav.classList.remove(
            "visible"
        );

    }

    clearInterval(
        timerInterval
    );

    flipped = [];

    matched = new Set();

    locked = false;

    timeIsUp = false;

    score = 0;

    timeLeft = 15;

    document
        .getElementById(
            "scoreNum"
        )
        .textContent = "0";

    const winBanner =
        document.getElementById(
            "winBanner"
        );

    winBanner.classList.remove(
        "visible"
    );

    winBanner.innerHTML = `
        ✦ All pairs matched! ✦<br>
        A true dance scholar.
    `;

    const timer =
        document.getElementById(
            "timer"
        );

    timer.textContent = "15";

    timer.classList.remove(
        "warning",
        "danger"
    );

    document
        .getElementById(
            "paneIdle"
        )
        .style.display = "";

    document
        .getElementById(
            "paneInfo"
        )
        .classList.remove(
            "visible"
        );

    document
        .getElementById(
            "resultOverlay"
        )
        .classList.remove(
            "visible",
            "win",
            "loss"
        );


    /* EXACTLY FOUR CARDS */

    const cards = [

        {
            pairId:"raj",
            type:"state",
            image:STATE_IMGS["rj"]
        },

        {
            pairId:"raj",
            type:"dance"
        },

        {
            pairId:"pun",
            type:"state",
            image:STATE_IMGS["pn"]
        },

        {
            pairId:"pun",
            type:"dance"
        }

    ];


    const shuffled =
        shuffle(cards);


    const area =
        document.getElementById(
            "cardsArea"
        );

    area.innerHTML = "";


    for(
        let row = 0;
        row < 2;
        row++
    ){

        const rowEl =
            document.createElement(
                "div"
            );

        rowEl.className =
            "card-row";


        for(
            let col = 0;
            col < 2;
            col++
        ){

            rowEl.appendChild(
                makeCard(
                    shuffled[
                        row * 2 + col
                    ]
                )
            );

        }

        area.appendChild(
            rowEl
        );

    }


    setTimeout(
        startTimer,
        5800
    );

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function makeCard(card){

    const fc =
        document.createElement(
            "div"
        );

    fc.className =
        "flip-card";

    fc.dataset.pairId =
        card.pairId;

    fc.dataset.type =
        card.type;


    if(card.type === "state"){

        fc.innerHTML = `

            <div class="flip-card-inner">

                <div
                    class="flip-card-front"
                ></div>

                <div
                    class="
                        flip-card-back
                        type-state
                    "
                >

                    <div
                        class="state-image"
                    >

                        <img
                            src="${card.image}"
                            alt=""
                        >

                    </div>

                </div>

            </div>

        `;

    }
    else{

        let imageClass = "";

        if(card.pairId === "raj"){

            imageClass =
                "ghoomar-image";

        }

        fc.innerHTML = `

            <div class="flip-card-inner">

                <div
                    class="flip-card-front"
                ></div>

                <div
                    class="
                        flip-card-back
                        type-dance
                    "
                >

                    <div
                        class="dance-image"
                    >

                        <img
                            class="${imageClass}"
                            src="${DANCE_IMGS[card.pairId]}"
                            alt=""
                        >

                    </div>

                </div>

            </div>

        `;

    }


    fc.addEventListener(
        "click",
        function(){

            onCardClick(fc);

        }
    );


    fc.addEventListener(
        "mouseenter",
        function(){

            if(
                timeIsUp ||
                matched.size === 2
            ){

                showInfo(
                    fc.dataset.pairId
                );

            }

        }
    );


    return fc;

}


/* =========================================================
   CARD CLICK
   ========================================================= */

function onCardClick(el){

    if(matched.size === 2){

        document
            .querySelectorAll(
                ".flip-card.selected-card"
            )
            .forEach(
                function(card){

                    card.classList.remove(
                        "selected-card"
                    );

                }
            );

        el.classList.add(
            "selected-card"
        );

        showInfo(
            el.dataset.pairId
        );

        return;

    }


    if(timeIsUp){

        document
            .querySelectorAll(
                ".flip-card.selected-card"
            )
            .forEach(
                function(card){

                    card.classList.remove(
                        "selected-card"
                    );

                }
            );

        el.classList.add(
            "selected-card"
        );

        showInfo(
            el.dataset.pairId
        );

        return;

    }


    if(locked)
        return;


    if(timeLeft <= 0)
        return;


    if(
        el.classList.contains(
            "revealed"
        ) ||
        el.classList.contains(
            "matched"
        )
    ){

        return;

    }


    if(flipped.length === 2)
        return;


    el.classList.add(
        "revealed"
    );


    flipped.push({

        el:el,

        pairId:
            el.dataset.pairId,

        type:
            el.dataset.type

    });


    if(flipped.length === 2){

        locked = true;

        setTimeout(
            evaluate,
            950
        );

    }

}


/* =========================================================
   EVALUATE
   ========================================================= */

function evaluate(){

    if(timeLeft <= 0)
        return;


    const [a,b] =
        flipped;


    if(
        a.pairId === b.pairId &&
        a.type !== b.type
    ){

        a.el.classList.add(
            "matched",
            "locked"
        );

        b.el.classList.add(
            "matched",
            "locked"
        );


        matched.add(
            a.pairId
        );


        score++;


        document
            .getElementById(
                "scoreNum"
            )
            .textContent =
            score;


        showInfo(
            a.pairId
        );


        if(score === 2){

            clearInterval(
                timerInterval
            );

            locked = true;


            document
                .querySelectorAll(
                    ".flip-card"
                )
                .forEach(
                    function(card){

                        card.classList.add(
                            "game-finished"
                        );

                        card.classList.remove(
                            "locked"
                        );

                    }
                );


            setTimeout(
                function(){

                    const winBanner =
                        document.getElementById(
                            "winBanner"
                        );

                    winBanner.innerHTML = `
                        ✦ All pairs matched! ✦<br>
                        A true dance scholar.
                    `;

                    winBanner.classList.add(
                        "visible"
                    );

                },
                400
            );


            setTimeout(
                function(){

                    showWinPopup();

                },
                1000
            );

        }

    }
    else{

        a.el.classList.remove(
            "revealed"
        );

        b.el.classList.remove(
            "revealed"
        );

    }


    flipped = [];


    if(
        score < 2 &&
        timeLeft > 0
    ){

        locked = false;

    }

}


/* =========================================================
   INFORMATION PANEL
   ========================================================= */

function showInfo(pairId){

    const p =
        PAIRS.find(
            function(x){

                return x.id === pairId;

            }
        );


    if(!p)
        return;


    document
        .getElementById(
            "paneIdle"
        )
        .style.display =
        "none";


    const paneInfo =
        document.getElementById(
            "paneInfo"
        );


    paneInfo.classList.remove(
        "visible"
    );


    void paneInfo.offsetWidth;


    document
        .getElementById(
            "infoState"
        )
        .textContent =
        p.state;


    document
        .getElementById(
            "infoDance"
        )
        .textContent =
        p.dance;


    document
        .getElementById(
            "infoDesc"
        )
        .textContent =
        p.desc;


    document
        .getElementById(
            "infoTag"
        )
        .textContent =
        p.tag;


    paneInfo.classList.add(
        "visible"
    );

}


/* START GAME */

initGame();

</script>
